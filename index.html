<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KL!KPIN · Button Pin Machine</title>
  <meta name="description" content="Shop cute button pins from an interactive vending machine.">
  <meta name="theme-color" content="#f1e6ff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%23ffd3df' stroke='%232c2554' stroke-width='8'/%3E%3Ccircle cx='36' cy='46' r='6' fill='%232c2554'/%3E%3Ccircle cx='64' cy='46' r='6' fill='%232c2554'/%3E%3Cpath d='M42 60q8 8 16 0' stroke='%232c2554' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Luckiest+Guy&family=Silkscreen&family=VT323&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-view="home">
  <!-- SCENERY (far layer, fixed): sky, sun, clouds, mountains and rolling hills,
       developed from the client's "scenery vending machine" sketch -->
  <div class="room" aria-hidden="true">
    <div class="sun">
      <svg viewBox="0 0 200 200">
        <g class="sun-rays" stroke="#f3c64f" stroke-width="10" stroke-linecap="round">
          <path d="M100 8v22M100 170v22M8 100h22M170 100h22M35 35l15 15M150 150l15 15M35 165l15-15M150 50l15-15"/>
        </g>
        <circle cx="100" cy="100" r="54" fill="#ffe98f" stroke="#e0a93b" stroke-width="6"/>
        <circle cx="84" cy="98" r="5" fill="#8a5a2b"/><circle cx="116" cy="98" r="5" fill="#8a5a2b"/>
        <path d="M92 112q8 7 16 0" fill="none" stroke="#8a5a2b" stroke-width="4.5" stroke-linecap="round"/>
        <ellipse cx="72" cy="112" rx="8" ry="5" fill="#ffb3c9"/><ellipse cx="128" cy="112" rx="8" ry="5" fill="#ffb3c9"/>
      </svg>
    </div>
    <svg class="cloud c1" viewBox="0 0 260 120"><use href="#cloudShape"/></svg>
    <svg class="cloud c2" viewBox="0 0 260 120"><use href="#cloudShape"/></svg>
    <svg class="cloud c3" viewBox="0 0 260 120"><use href="#cloudShape"/></svg>
    <svg class="birds" viewBox="0 0 120 50"><path d="M6 24q10-12 20 0q10-12 20 0M70 12q8-9 16 0q8-9 16 0" fill="none" stroke="#8f84c4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>

    <svg class="hills" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMax slice">
      <defs>
        <symbol id="cloudShape" viewBox="0 0 260 120">
          <g fill="none" stroke="#b9addf" stroke-width="9">
            <circle cx="70" cy="72" r="38"/><circle cx="125" cy="52" r="46"/><circle cx="185" cy="70" r="36"/><rect x="40" y="70" width="180" height="40" rx="20"/>
          </g>
          <g fill="#fff">
            <circle cx="70" cy="72" r="38"/><circle cx="125" cy="52" r="46"/><circle cx="185" cy="70" r="36"/><rect x="40" y="70" width="180" height="40" rx="20"/>
          </g>
          <path d="M92 50q14-16 30-8" fill="none" stroke="#e8e2ff" stroke-width="7" stroke-linecap="round"/>
        </symbol>
        <linearGradient id="mtnFar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3dbff"/><stop offset="1" stop-color="#f1e8ff"/></linearGradient>
        <linearGradient id="hillPink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd9e6"/><stop offset="1" stop-color="#ffe9f0"/></linearGradient>
        <linearGradient id="hillMint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cdf1df"/><stop offset="1" stop-color="#e4f8ee"/></linearGradient>
      </defs>
      <!-- far mountains (softest outline = farthest away) -->
      <path d="M-40 420 L180 150 Q215 112 250 150 L470 360 L610 250 Q640 226 670 250 L860 400 L1060 170 Q1095 132 1130 170 L1400 420 L1520 330 Q1550 308 1580 330 L1660 400 V640 H-40Z"
            fill="url(#mtnFar)" stroke="#c3b8ec" stroke-width="6" stroke-linejoin="round"/>
      <path d="M180 150 Q215 112 250 150 L236 178 L216 162 L196 180Z M1060 170 Q1095 132 1130 170 L1116 196 L1096 180 L1076 198Z M610 250 Q640 226 670 250 L660 268 L640 256 L622 270Z"
            fill="#fffaf2" stroke="#c3b8ec" stroke-width="5" stroke-linejoin="round"/>
      <!-- rolling pink hills -->
      <path d="M-40 520 C160 400 360 400 560 470 C700 520 820 520 960 450 C1120 372 1330 380 1660 500 V640 H-40Z"
            fill="url(#hillPink)" stroke="#e7aec5" stroke-width="6" stroke-linejoin="round"/>
      <!-- lollipop trees -->
      <g stroke="#c98fae" stroke-width="5" stroke-linecap="round">
        <path d="M250 452v34M300 446v36M1240 420v34M1300 424v34M1355 432v30"/>
      </g>
      <g fill="#ffb3c9" stroke="#c98fae" stroke-width="5">
        <circle cx="250" cy="440" r="20"/><circle cx="300" cy="432" r="24"/><circle cx="1240" cy="406" r="22"/><circle cx="1300" cy="410" r="18"/><circle cx="1355" cy="420" r="16"/>
      </g>
      <!-- near mint meadow -->
      <path d="M-40 590 C200 520 420 540 640 575 C860 610 1080 520 1300 535 C1440 545 1560 575 1660 590 V640 H-40Z"
            fill="url(#hillMint)" stroke="#94cfb3" stroke-width="6" stroke-linejoin="round"/>
      <g fill="none" stroke="#94cfb3" stroke-width="4" stroke-linecap="round">
        <path d="M140 586l6-12 6 12M420 566l6-12 6 12M1120 548l6-12 6 12M1460 566l6-12 6 12"/>
      </g>
    </svg>
  </div>
  <h1 class="sr-only">KL!KPIN button pin vending machine</h1>

  <main id="viewport" class="viewport">
    <div id="camera" class="camera">
      <div id="machine" class="machine v-home">
        <!-- SCENERY (near layer, moves with the machine): checker plaza, fence, mailbox + bush -->
        <svg class="plaza" viewBox="0 0 2600 600" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <pattern id="checker" width="110" height="110" patternUnits="userSpaceOnUse">
              <rect width="110" height="110" fill="#fff3f7"/><rect width="55" height="55" fill="#ffd8e6"/><rect x="55" y="55" width="55" height="55" fill="#ffd8e6"/>
            </pattern>
          </defs>
          <path d="M360 0 H2240 L2600 600 H0Z" fill="url(#checker)" stroke="#2c2554" stroke-width="6" stroke-linejoin="round"/>
        </svg>
        <svg class="prop prop-l" viewBox="0 0 560 330" aria-hidden="true">
          <g stroke="#2c2554" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
            <!-- picket fence -->
            <rect x="20" y="170" width="470" height="26" rx="8" fill="#fff7ec"/>
            <rect x="20" y="248" width="470" height="26" rx="8" fill="#fff7ec"/>
            <path d="M40 320V140l30-34 30 34v180Z M150 320V140l30-34 30 34v180Z M260 320V140l30-34 30 34v180Z M370 320V140l30-34 30 34v180Z" fill="#fffdf6"/>
            <!-- little sign -->
            <path d="M478 322V120" fill="none"/>
            <rect x="420" y="40" width="130" height="86" rx="18" fill="#ffd6e2"/>
          </g>
          <text x="485" y="78" text-anchor="middle" font-family="Luckiest Guy, Fredoka, sans-serif" font-size="30" fill="#8e1d39">PINS</text>
          <text x="485" y="110" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="22" fill="#2c2554">this way ♡</text>
          <!-- flower tuft -->
          <g stroke="#2c2554" stroke-width="5">
            <path d="M110 330c-10-40 10-60 20-70M130 330c4-30 20-44 32-50" fill="none" stroke="#5cb88f"/>
            <circle cx="130" cy="256" r="14" fill="#ffe98f"/><circle cx="164" cy="276" r="12" fill="#ffb3c9"/>
          </g>
        </svg>
        <svg class="prop prop-r" viewBox="0 0 560 360" aria-hidden="true">
          <g stroke="#2c2554" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
            <!-- round bush -->
            <path d="M200 356c-60 0-80-60-50-96-30-50 20-110 80-90 30-50 120-50 150 0 60-20 110 40 80 90 30 36 10 96-50 96Z" fill="#c4f0dc"/>
            <!-- arched mailbox on a post (the arch from the sketch) -->
            <path d="M92 356V236" fill="none"/>
            <path d="M30 236V160a62 62 0 0 1 124 0v76Z" fill="#ffb3c9"/>
            <path d="M60 236v-70a32 32 0 0 1 64 0v70" fill="#ffd6e2"/>
            <path d="M154 176h40v-40h-22" fill="none"/>
          </g>
          <g fill="#ff7fa7" stroke="#2c2554" stroke-width="4">
            <circle cx="250" cy="220" r="11"/><circle cx="330" cy="250" r="10"/><circle cx="380" cy="300" r="11"/><circle cx="290" cy="310" r="9"/>
          </g>
          <path d="M80 190q12 10 24 0" fill="none" stroke="#2c2554" stroke-width="5" stroke-linecap="round"/>
          <path d="M240 200q20-20 50-10" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".7"/>
        </svg>
        <!-- LOGO SIGN on top of the cabinet (phone layout, per the client sketch) -->
        <div class="topper" aria-hidden="true">
          <span class="topper-post l"></span><span class="topper-post r"></span>
          <div class="topper-card">
            <span class="screw tl"></span><span class="screw tr"></span>
            <span class="screw bl"></span><span class="screw br"></span>
            <span class="spark tp-1"></span><span class="spark tp-2"></span><span class="spark tp-3"></span>
            <div class="topper-brand">KL<span class="bang">!</span>KPIN</div>
            <div class="topper-sub"><i></i>button pin machine<i></i></div>
          </div>
          <div class="cat-sticker topper-cat"></div>
        </div>
        <div class="shell" aria-hidden="true"></div>
        <svg id="stripes" class="stripes" aria-hidden="true"></svg>
        <div class="divider" aria-hidden="true"></div>
        <span class="screw face-screw fs-1" aria-hidden="true"></span>
        <span class="screw face-screw fs-2" aria-hidden="true"></span>

        <!-- DISPLAY WINDOW -->
        <section id="window" class="window" aria-label="Pin display window">
          <div id="windowInner" class="window-inner">
            <div class="glass">
              <div id="tabs" class="tabs" role="group" aria-label="Pin categories"></div>
              <div id="batchViewport" class="batch-viewport">
                <div id="batchTrack" class="batch-track"></div>
              </div>
              <div class="shine" aria-hidden="true"></div>
              <div class="batch-bar">
                <span class="swipe-hint" aria-hidden="true">&lsaquo; swipe &rsaquo;</span>
                <div id="dots" class="dots"></div>
                <span id="batchLabel" class="batch-label"></span>
              </div>
            </div>
            <button id="prevBatch" class="batch-arrow prev" aria-label="Previous batch of pins">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="nextBatch" class="batch-arrow next" aria-label="Next batch of pins">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <button id="windowHit" class="window-hit" aria-label="Open the pin window to start shopping">
            <span class="peek">peek inside ✿</span>
          </button>
        </section>

        <!-- STICKERS (landscape position --lx/--ly, phone position --px/--py) -->
        <div class="sticker" data-shape="star" aria-hidden="true" style="--lx:26px;--ly:44px;--px:40px;--py:1252px;--s:64px;--r:-8deg"></div>
        <div class="sticker" data-shape="heart" aria-hidden="true" style="--lx:30px;--ly:270px;--px:150px;--py:1296px;--s:60px;--r:-12deg"></div>
        <div class="sticker" data-shape="sparkle" aria-hidden="true" style="--lx:40px;--ly:480px;--px:70px;--py:1390px;--s:40px;--r:0deg"></div>
        <div class="sticker" data-shape="rect" aria-hidden="true" style="--lx:1298px;--ly:120px;--px:846px;--py:1262px;--s:66px;--r:28deg"></div>
        <div class="sticker" data-shape="sparkle" aria-hidden="true" style="--lx:1318px;--ly:42px;--px:900px;--py:1390px;--s:36px;--r:10deg"></div>
        <div class="sticker" data-shape="flower" aria-hidden="true" style="--lx:1302px;--ly:540px;--px:790px;--py:1470px;--s:64px;--r:10deg"></div>
        <div class="sticker wide-only" data-shape="heart" aria-hidden="true" style="--lx:40px;--ly:910px;--px:6px;--py:520px;--s:54px;--r:14deg"></div>
        <div class="sticker" data-shape="rectY" aria-hidden="true" style="--lx:1250px;--ly:900px;--px:80px;--py:1540px;--s:62px;--r:-20deg"></div>
        <div class="sticker" data-shape="rect" aria-hidden="true" style="--lx:1296px;--ly:1040px;--px:840px;--py:1600px;--s:56px;--r:-14deg"></div>
        <div class="sticker" data-shape="rectY" aria-hidden="true" style="--lx:52px;--ly:1050px;--px:160px;--py:1630px;--s:54px;--r:-20deg"></div>
        <div class="sticker wide-only" data-shape="star" aria-hidden="true" style="--lx:1300px;--ly:1200px;--px:918px;--py:700px;--s:58px;--r:10deg"></div>

        <!-- TOTAL · KEYPAD · QR · RECEIPT BUTTON · PRINTER -->
        <section id="panel" class="panel" aria-label="Order total, keypad, QR screen and receipt printer">
          <div id="lcd" class="total-display" aria-hidden="true">
            <div class="td-screen">
              <div class="td-row td-top">
                <span id="lcdText" class="td-label">TOTAL</span>
                <span id="lcdQty" class="td-qty">QTY 00</span>
              </div>
              <div class="td-row td-main">
                <span class="td-cur">PHP</span>
                <span id="lcdTotal" class="td-amt" data-ghost="888.88">0.00</span>
              </div>
            </div>
            <span class="td-led" aria-hidden="true">♥</span>
            <span class="td-tag" aria-hidden="true">♡ kl!kpin ♡</span>
          </div>
          <div class="keypad"><div id="keys" class="keys" aria-hidden="true"></div></div>
          <div id="qrScreen" class="qr-screen"></div>
          <button id="receiptKey" class="receipt-key">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-2-1.5L14 21l-2-1.5L10 21l-2-1.5L6 21z" fill="#fff" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 8h6M9 12h6M9 16h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span>Receipt</span><span id="rkCount" class="rk-count"></span>
            <span class="receipt-heart" aria-hidden="true">♡</span>
          </button>
          <div class="printer" aria-hidden="true">
            <span class="slot-mouth"></span>
            <span class="paper-stub"><i></i><i></i><b>♡</b></span>
          </div>
          <div id="receiptWrap" class="receipt-wrap">
            <div id="receipt" class="receipt" role="region" aria-label="Receipt"></div>
          </div>
        </section>

        <!-- PUSH DOOR (where pins drop) -->
        <section id="pushDoor" class="push-door" aria-label="Pickup door">
          <span class="screw tl" aria-hidden="true"></span><span class="screw tr" aria-hidden="true"></span>
          <span class="screw bl" aria-hidden="true"></span><span class="screw br" aria-hidden="true"></span>
          <div class="door-well">
            <div id="tray" class="tray"></div>
            <button id="flap" class="flap" aria-label="Push the flap to collect your pins">
              <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6l2 1M8 12h3M4 18l2-1" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
              <span class="push-word">PUSH</span>
              <svg class="chev flip" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6l2 1M8 12h3M4 18l2-1" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
            </button>
          </div>
          <span class="push-bubble" aria-hidden="true">push to collect ♡</span>
        </section>

        <!-- SIDE PANEL -->
        <aside class="side" aria-hidden="true">
          <div class="side-card">
            <span class="screw tl"></span><span class="screw tr"></span>
            <span class="screw bl"></span><span class="screw br"></span>
            <div class="brand">KL<span class="bang">!</span>KPIN</div>
            <span class="spark sp-1"></span><span class="spark sp-2"></span><span class="spark sp-3"></span><span class="spark sp-4"></span>
            <div class="lights"><span></span><span></span></div>
            <div class="barcode"><span class="bars"></span><span class="nums">4 8 2 0 1 7 ♡</span></div>
            <div id="catSticker" class="cat-sticker"></div>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <!-- HUD -->
  <div class="hud hud-top"><p id="hint" class="hint"></p></div>
  <nav class="hud hud-bottom" aria-label="Machine controls">
    <button id="chipHome" class="chip" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Whole machine
    </button>
    <button id="chipReceipt" class="chip chip-pink">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-2-1.5L14 21l-2-1.5L10 21l-2-1.5L6 21z" fill="#fff" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 8h6M9 12h6M9 16h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Receipt <span id="chipCount" class="chip-count">0</span>
    </button>
  </nav>
  <button id="muteBtn" class="hud mute" aria-pressed="false"></button>

  <!-- PAYMENT / FINAL RECEIPT POP-UP (glass background) -->
  <div id="payModal" class="pay-modal" hidden>
    <div class="pm-glass" data-act="dismiss" aria-hidden="true"></div>
    <section id="payCard" class="pm-card" role="dialog" aria-modal="true" aria-labelledby="payTitle">
      <div id="payBody" class="pay-body"></div>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="sr" class="sr-only" aria-live="polite"></div>
  <div id="confetti" class="confetti" aria-hidden="true"></div>

  <script type="module" src="js/pins.js"></script>
  <script type="module" src="js/payment.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
